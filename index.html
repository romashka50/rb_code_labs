<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS Quest: learn JavaScript by playing</title>
  <meta name="description" content="Interactive JavaScript game-labs. Write real code, help the robot Bit, and learn step by step.">
  <link rel="icon" href="assets/logo.png">
  <meta property="og:title" content="JS Quest: learn JavaScript by playing">
  <meta property="og:image" content="assets/poster.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#" id="brand"><img class="logo" src="assets/logo.png" alt="" width="80" height="80"><span>JS Quest</span></a>
    <button class="chip" id="menuBtn" aria-haspopup="dialog">☰ <span id="lecName">Lecture 1</span> · <span id="levelNo"></span></button>
    <div class="progress" title="Levels completed"><div class="bar"><i id="bar"></i></div><span id="progText"></span></div>
    <span class="stars" id="starTotal" title="Stars earned"></span>
    <button class="chip" id="langBtn" aria-label="Language">УК</button>
    <a class="chip video" id="videoLink" href="#" target="_blank" rel="noopener" hidden>▶ Watch the lecture</a>
  </header>

  <main class="game">
    <section class="col-left">
      <article class="card lesson" id="lesson" aria-live="polite"></article>
      <aside class="card fun" id="fun" hidden></aside>
    </section>

    <section class="col-right">
      <div class="card stage" id="stage">
        <div class="bit-wrap">
          <svg class="bit idle" id="bit" viewBox="0 0 120 130" role="img" aria-label="Bit the robot">
            <line x1="60" y1="8" x2="60" y2="26" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <circle cx="60" cy="8" r="6" class="antenna"/>
            <rect x="14" y="26" width="92" height="76" rx="22" class="head"/>
            <rect x="26" y="42" width="68" height="42" rx="14" class="face"/>
            <g class="eyes"><circle cx="45" cy="60" r="7" class="eye"/><circle cx="75" cy="60" r="7" class="eye"/></g>
            <g class="eyes-happy"><path d="M38 64 q7 -12 14 0" /><path d="M68 64 q7 -12 14 0" /></g>
            <g class="eyes-sad"><path d="M39 54 l12 12 M51 54 l-12 12 M69 54 l12 12 M81 54 l-12 12" /></g>
            <path class="mouth m-idle" d="M48 76 q12 6 24 0" />
            <path class="mouth m-happy" d="M44 73 q16 18 32 0" />
            <path class="mouth m-sad" d="M48 80 q12 -8 24 0" />
            <rect x="34" y="104" width="52" height="20" rx="8" class="body"/>
          </svg>
          <div class="bubble" id="bubble"></div>
        </div>
        <div class="crates" id="crates"></div>
        <ul class="goals" id="goals"></ul>
        <div class="win" id="win" hidden></div>
      </div>

      <div class="card play" id="play"></div>
    </section>
  </main>

  <dialog id="menu">
    <form method="dialog" class="menu-head"><h2 id="menuTitle">Choose a level</h2><button class="x" aria-label="Close">✕</button></form>
    <div id="menuBody"></div>
    <p class="menu-foot"><button class="ghost" id="resetAll">Reset my progress</button></p>
  </dialog>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="engine.js"></script>
  <script src="i18n.js"></script>
  <script src="levels/lec1.js"></script>
  <script src="levels/lec1.uk.js"></script>
  <script src="levels/lec1.fun.js"></script>
  <script src="app.js"></script>
</body>
</html>
